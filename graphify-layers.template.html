<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>LegacyVault - API / Application / Infrastructure</title>
<script src="https://unpkg.com/vis-network@9.1.6/standalone/umd/vis-network.min.js"></script>
<style>
  :root { --bg:#0f0f1a; --panel:#1a1a2e; --border:#2a2a4e; --input-border:#3a3a5e; --text:#e0e0e0; --text-2:#aaa; --text-3:#ccc; --muted:#555; --count:#666; --node-label:#fff; }
  [data-theme="light"] { --bg:#fff; --panel:#f8f9fa; --border:#d9dee5; --input-border:#c3cad4; --text:#222; --text-2:#666; --text-3:#333; --muted:#888; --count:#777; --node-label:#222; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; display:flex; height:100vh; overflow:hidden; }
  #graph-wrap { flex:1; position:relative; }
  #graph { position:absolute; inset:0; }
  #toolbar { position:absolute; top:12px; left:12px; z-index:5; display:flex; gap:8px; }
  #toolbar button { background:var(--panel); color:var(--text); border:1px solid var(--input-border); border-radius:6px; padding:6px 12px; font-size:12px; cursor:pointer; }
  #toolbar button:hover, #toolbar button.on { border-color:#4E79A7; }
  #sidebar { width:400px; background:var(--panel); border-left:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
  #search-wrap { padding:12px; border-bottom:1px solid var(--border); }
  #search { width:100%; background:var(--bg); border:1px solid var(--input-border); color:var(--text); padding:7px 10px; border-radius:6px; font-size:13px; outline:none; }
  #search:focus { border-color:#4E79A7; }
  #search-results { max-height:160px; overflow-y:auto; padding:4px 12px; border-bottom:1px solid var(--border); display:none; }
  .search-item { padding:4px 6px; cursor:pointer; border-radius:4px; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .search-item:hover { background:var(--border); }
  #api-wrap { padding:12px; border-bottom:1px solid var(--border); }
  #api-search { width:100%; background:var(--bg); border:1px solid var(--input-border); color:var(--text); padding:7px 10px; border-radius:6px; font-size:13px; outline:none; }
  #api-search:focus { border-color:#4E79A7; }
  #api-results { max-height:190px; overflow-y:auto; margin-top:6px; }
  .api-item { padding:3px 6px; cursor:pointer; border-radius:4px; font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .api-item:hover { background:var(--border); }
  .verb { display:inline-block; min-width:44px; font-weight:700; font-size:10.5px; margin-right:4px; }
  .explain { font-size:13px; line-height:1.55; }
  .apilink { display:block; padding:4px 6px; border-radius:4px; cursor:pointer; font-size:12px; }
  .apilink:hover { background:var(--border); }
  .explain h4 { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-2); margin:10px 0 4px; }
  .explain ol { padding-left:18px; } .explain li { margin:4px 0; }
  .explain code { background:var(--bg); border:1px solid var(--border); border-radius:3px; padding:0 4px; font-size:11.5px; color:#7aa2ff; }
  .explain ul { padding-left:18px; color:#e8a0a0; }
  #info-panel { padding:12px 14px; border-bottom:1px solid var(--border); flex:none; max-height:18vh; overflow-y:auto; }
  #explain-wrap { flex:1; min-height:120px; overflow-y:auto; overflow-x:hidden; padding:12px 14px; border-bottom:1px solid var(--border); }
  h3 { font-size:13px; color:var(--text-2); margin-bottom:8px; text-transform:uppercase; letter-spacing:.05em; }
  #info-content { font-size:13px; color:var(--text-3); line-height:1.6; }
  #info-content .field { margin-bottom:5px; } #info-content b { color:var(--text); }
  .empty { color:var(--muted); font-style:italic; }
  .neighbor-link { display:block; padding:2px 6px; margin:2px 0; border-radius:3px; cursor:pointer; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-left:3px solid var(--border); }
  .neighbor-link:hover { background:var(--border); }
  #neighbors-list { max-height:80px; overflow-y:auto; margin-top:4px; }
  #legend-wrap { flex:none; max-height:150px; overflow-y:auto; padding:10px 14px; }
  .legend-item { display:flex; align-items:flex-start; gap:8px; padding:5px 0; cursor:pointer; border-radius:4px; font-size:12px; }
  .legend-item:hover { background:var(--border); padding-left:4px; }
  .legend-item.dimmed { opacity:.35; }
  .legend-dot { width:12px; height:12px; border-radius:50%; flex-shrink:0; margin-top:2px; }
  .legend-label { flex:1; } .legend-label small { display:block; color:var(--count); font-size:11px; }
  .legend-count { color:var(--count); font-size:11px; }
  #stats { padding:10px 14px; border-top:1px solid var(--border); font-size:11px; color:var(--count); }
</style>
</head>
<body>
<div id="graph-wrap"><div id="toolbar"><button id="b-layer" class="on">Theo tầng</button><button id="b-force">Tự do</button><button id="b-theme">Sáng/Tối</button></div>
<div id="graph"></div></div>
<div id="sidebar">
  <div id="search-wrap"><input id="search" type="text" placeholder="Tìm hàm hoặc lớp..." autocomplete="off"></div>
  <div id="search-results"></div>
  <div id="api-wrap"><input id="api-search" type="text" placeholder="Tìm theo API (vd: POST /auth/login)..." autocomplete="off"><div id="api-results"></div></div>
  <div id="info-panel"><h3>Chi tiết</h3><div id="info-content"><span class="empty">Bấm vào một hàm để xem</span></div></div>
  <div id="explain-wrap"><h3>Cách API chạy</h3><div id="explain"><span class="empty">Chọn một API (ô "Tìm theo API") hoặc bấm vào hàm controller để xem các bước chạy.</span></div></div>
  <details id="legend-wrap"><summary style="cursor:pointer;font-size:13px;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em">Các tầng</summary><div id="legend" style="margin-top:8px"></div></details>
  <div id="stats"></div>
</div>
<script>
const D = __DATA__;
const LAYERS = [
  {name:'API · Controllers', sub:'Hàm ở tầng API', color:'#4E79A7'},
  {name:'Application · Service interfaces', sub:'Cầu nối API ↔ Application', color:'#B07AA1'},
  {name:'Application · Service implementations', sub:'Xử lý nghiệp vụ', color:'#59A14F'},
  {name:'Application · Ports', sub:'Interface Repository / Storage / Security / Notification (Application ↔ Infrastructure)', color:'#F28E2B'},
  {name:'Infrastructure · Implementations', sub:'Cài đặt cụ thể', color:'#E15759'}
];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const deg = {}; D.edges.forEach(([s,t]) => { deg[s]=(deg[s]||0)+1; deg[t]=(deg[t]||0)+1; });
const byId = {}; D.nodes.forEach(n => byId[n.id] = n);
const adj = {}; D.edges.forEach(([s,t]) => { (adj[s]=adj[s]||[]).push(t); (adj[t]=adj[t]||[]).push(s); });
const hidden = new Set();
const VC = {GET:'#59A14F', POST:'#4E79A7', PUT:'#F28E2B', PATCH:'#B07AA1', DELETE:'#E15759'};
const apiHtml = a => { const [v, ...r] = a.split(' '); return '<span class="verb" style="color:'+VC[v]+'">'+v+'</span>'+esc(r.join(' ').replace(/^\/api\/v1/, '')); };

const pos = {};
(function layout() {
  const inn = {}; D.edges.forEach(([s,t]) => (inn[t]=inn[t]||[]).push(s));
  const GAP = 26, order = [[],[],[],[],[]];
  D.nodes.forEach(n => order[n.col].push(n));
  order[0].sort((a,b) => a.name.localeCompare(b.name));
  order[0].forEach((n,i) => pos[n.id] = i*GAP);
  for (let c = 1; c < 5; c++) {
    const key = n => { const p = (inn[n.id]||[]).filter(x => pos[x] !== undefined).map(x => pos[x]); return p.length ? p.reduce((a,b)=>a+b)/p.length : 1e9; };
    order[c].sort((a,b) => key(a)-key(b) || a.name.localeCompare(b.name));
    order[c].forEach((n,i) => pos[n.id] = i*GAP);
  }
})();
const visNodes = new vis.DataSet(D.nodes.map(n => ({
  id:n.id, label:n.name.split('.')[1], title:n.name, x:n.col*330, y:pos[n.id], group:n.col,
  color:{background:LAYERS[n.col].color, border:LAYERS[n.col].color, highlight:{background:LAYERS[n.col].color, border:'#fff'}},
  size:8 + Math.min(18, (deg[n.id]||1)*2), shape:'dot',
  font:{color:getComputedStyle(document.documentElement).getPropertyValue('--node-label').trim()||'#fff', size:11}
})));
const visEdges = new vis.DataSet(D.edges.map(([s,t],i) => ({id:i, from:s, to:t, arrows:{to:{scaleFactor:.5}}, color:{color:'#5a5a7a', opacity:.5}, width:1, smooth:{type:'cubicBezier', forceDirection:'horizontal', roundness:.5}})));

const container = document.getElementById('graph');
const layered = {layout:{hierarchical:{enabled:false}}, physics:{enabled:false}};
const free = {layout:{hierarchical:{enabled:false}}, physics:{enabled:true, solver:'forceAtlas2Based', forceAtlas2Based:{gravitationalConstant:-60, springLength:90}, stabilization:{iterations:200}}};
const network = new vis.Network(container, {nodes:visNodes, edges:visEdges}, Object.assign({
  interaction:{hover:true, tooltipDelay:120, multiselect:false}, edges:{smooth:{type:'cubicBezier'}}
}, layered));

network.once('afterDrawing', () => network.fit());
setTimeout(() => network.fit(), 300); setTimeout(() => network.fit({animation:false}), 1000); addEventListener('load', () => network.fit()); addEventListener('resize', () => network.fit());
function setMode(m) {
  network.setOptions(m === 'layer' ? layered : free);
  if (m === 'layer') visNodes.update(D.nodes.map(n => ({id:n.id, x:n.col*330, y:pos[n.id]})));
  else visNodes.update(D.nodes.map(n => ({id:n.id, x:undefined, y:undefined})));
  document.getElementById('b-layer').classList.toggle('on', m === 'layer');
  document.getElementById('b-force').classList.toggle('on', m === 'free');
  network.fit();
}
document.getElementById('b-layer').onclick = () => setMode('layer');
document.getElementById('b-force').onclick = () => setMode('free');
document.getElementById('b-theme').onclick = () => {
  const r = document.documentElement, light = r.dataset.theme !== 'light';
  r.dataset.theme = light ? 'light' : '';
  const c = getComputedStyle(r).getPropertyValue('--node-label').trim();
  visNodes.update(D.nodes.map(n => ({id:n.id, font:{color:c, size:11}})));
};

function resetStyle() {
  visNodes.update(D.nodes.map(n => ({id:n.id, hidden:hidden.has(n.col), opacity:1})));
  visEdges.update(D.edges.map((e,i) => ({id:i, color:{color:'#5a5a7a', opacity:.5}, width:1, hidden:hidden.has(byId[e[0]].col)||hidden.has(byId[e[1]].col)})));
}
function walk(id, dir, seen) {
  D.edges.forEach(([s,t]) => { const a = dir>0 ? s : t, b = dir>0 ? t : s; if (a===id && !seen.has(b)) { seen.add(b); walk(b, dir, seen); } });
}
let outIdx = null;
function focusNode(id) {
  const up = new Set([id]), down = new Set([id]);
  const out = {}, inn = {};
  D.edges.forEach(([s,t]) => { (out[s]=out[s]||[]).push(t); (inn[t]=inn[t]||[]).push(s); });
  (function w(x, m, set) { (m[x]||[]).forEach(y => { if (!set.has(y)) { set.add(y); w(y, m, set); } }); })(id, out, down);
  (function w(x, m, set) { (m[x]||[]).forEach(y => { if (!set.has(y)) { set.add(y); w(y, m, set); } }); })(id, inn, up);
  const S = new Set([...up, ...down]);
  visNodes.update(D.nodes.map(n => ({id:n.id, opacity:S.has(n.id)?1:.08, font:{color:S.has(n.id)?undefined:'rgba(127,127,127,.15)'}})));
  visEdges.update(D.edges.map(([s,t],i) => { const on = S.has(s)&&S.has(t); return {id:i, color:{color:on?'#7aa2ff':'#5a5a7a', opacity:on?1:.05}, width:on?2:1}; }));
  const n = byId[id], ns = (adj[id]||[]).map(x => byId[x]);
  document.getElementById('info-content').innerHTML =
    '<div class="field"><b>'+esc(n.name.split('.')[1])+'</b></div>' +
    (n.api ? '<div class="field">API: '+apiHtml(n.api)+'</div>' : '') + '<div class="field">Lớp: '+esc(n.cls)+'</div>' +
    '<div class="field">Tầng: <span style="color:'+LAYERS[n.col].color+'">'+esc(LAYERS[n.col].name)+'</span></div>' +
    '<div class="field">Đường đi: '+(S.size-1)+' hàm liên quan</div>' +
    '<div class="field"><b>Nối trực tiếp ('+ns.length+')</b></div><div id="neighbors-list">' +
    ns.map(m => '<span class="neighbor-link" data-id="'+esc(m.id)+'" style="border-left-color:'+LAYERS[m.col].color+'">'+esc(m.name)+'</span>').join('') + '</div>';
  renderExplain(n, up);
  document.querySelectorAll('.neighbor-link').forEach(el => el.onclick = () => select(el.dataset.id));
}
function renderExplain(n, up) {
  const box = document.getElementById('explain');
  const code = t => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>');
  if (n.explain) {
    const e = n.explain;
    box.innerHTML = '<div class="explain"><div style="margin-bottom:6px">' + apiHtml(n.api) + '</div><div>' + code(e.summary) + '</div>' +
      '<div style="margin-top:6px"><b>Quyền truy cập:</b> ' + esc(e.access) + '</div>' +
      '<h4>Các bước chạy</h4><ol>' + e.steps.map(s => '<li>' + code(s) + '</li>').join('') + '</ol>' +
      (e.errors && e.errors.length ? '<h4>Lỗi có thể gặp</h4><ul>' + e.errors.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul>' : '') + '</div>';
    return;
  }
  const apis = D.nodes.filter(m => m.api && up.has(m.id));
  box.innerHTML = apis.length
    ? '<div class="empty" style="margin-bottom:6px">Hàm này được dùng bởi các API sau, bấm vào để xem cách chạy:</div>' +
      apis.map(m => '<span class="apilink" data-id="' + esc(m.id) + '">' + apiHtml(m.api) + '</span>').join('')
    : '<span class="empty">Hàm này không được API nào gọi tới trong sơ đồ.</span>';
  box.querySelectorAll('.apilink').forEach(el => el.onclick = () => select(el.dataset.id));
}
function clearFocus() {
  document.getElementById('explain').innerHTML = '<span class="empty">Chọn một API (ô "Tìm theo API") hoặc bấm vào hàm controller để xem các bước chạy.</span>'; resetStyle(); document.getElementById('info-content').innerHTML = '<span class="empty">Bấm vào một hàm để xem</span>'; }
function select(id) { network.selectNodes([id]); network.focus(id, {scale:1, animation:true}); focusNode(id); }
network.on('click', p => { p.nodes.length ? focusNode(p.nodes[0]) : clearFocus(); });

// legend
const lg = document.getElementById('legend');
LAYERS.forEach((l,i) => {
  const cnt = D.nodes.filter(n => n.col===i).length, d = document.createElement('div');
  d.className = 'legend-item';
  d.innerHTML = '<span class="legend-dot" style="background:'+l.color+'"></span><span class="legend-label">'+esc(l.name)+'<small>'+esc(l.sub)+'</small></span><span class="legend-count">'+cnt+'</span>';
  d.onclick = () => { hidden.has(i) ? hidden.delete(i) : hidden.add(i); d.classList.toggle('dimmed', hidden.has(i)); resetStyle(); };
  lg.appendChild(d);
});
// search
const sb = document.getElementById('search'), sr = document.getElementById('search-results');
sb.oninput = () => {
  const q = sb.value.trim().toLowerCase();
  if (!q) { sr.style.display = 'none'; return; }
  const hits = D.nodes.filter(n => (n.name+' '+(n.api||'')).toLowerCase().includes(q)).slice(0, 30);
  sr.innerHTML = hits.map(n => '<div class="search-item" data-id="'+esc(n.id)+'" style="border-left:3px solid '+LAYERS[n.col].color+'">'+esc(n.name)+'</div>').join('');
  sr.style.display = hits.length ? 'block' : 'none';
  sr.querySelectorAll('.search-item').forEach(el => el.onclick = () => { select(el.dataset.id); sr.style.display = 'none'; });
};
const as = document.getElementById('api-search'), ar = document.getElementById('api-results');
function showApis() {
  const q = as.value.trim().toLowerCase().replace(/\s+/g, ' ');
  const toks = q.split(' ').filter(Boolean), hits = D.nodes.filter(n => n.api && toks.every(k => (n.api.toLowerCase() + ' ' + n.name.toLowerCase()).includes(k)));
  ar.innerHTML = hits.map(n => '<div class="api-item" data-id="'+esc(n.id)+'" title="'+esc(n.api+' → '+n.name)+'">'+apiHtml(n.api)+'</div>').join('') || '<span class="empty">Không có API khớp</span>';
  ar.querySelectorAll('.api-item').forEach(el => el.onclick = () => select(el.dataset.id));
}
as.oninput = showApis; as.onfocus = showApis;
document.getElementById('stats').textContent = D.nodes.length + ' hàm · ' + D.edges.length + ' liên kết';
</script>
</body>
</html>
