services:
  sqlserver:
    # SQL Server 2022 image pinned to the version verified for this starter.
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?Run scripts/setup-local.ps1 first}
    ports:
      - "127.0.0.1:${SQL_PORT:-14331}:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - 'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -l 5 -Q "SELECT 1" -o /dev/null'
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

volumes:
  sql-data:
