const LAYERS = [
  {name:'API · Controllers', sub:'Hàm ở tầng API', color:'#4E79A7'},
  {name:'Application · Service interfaces', sub:'Cầu nối API ↔ Application', color:'#B07AA1'},

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const pos = {};

  const GAP = 26, order = [[],[],[],[],[]];
  D.nodes.forEach(n => order[n.col].push(n));
  order[0].sort((a,b) => a.name.localeCompare(b.name));
  order[0].forEach((n,i) => pos[n.id] = i*GAP);
  for (let c = 1; c < 5; c++) {
    const key = n => { const p = (inn[n.id]||[]).filter(x => pos[x] !== undefined).map(x => pos[x]); return p.length ? p.reduce((a,b)=>a+b)/p.length : 1e9; };

const visNodes = new vis.DataSet(D.nodes.map(n => ({

  size:8 + Math.min(18, (deg[n.id]||1)*2), shape:'dot',
  font:{color:getComputedStyle(document.documentElement).getPropertyValue('--node-label').trim()||'#fff', size:11}

const container = document.getElementById('graph');
const layered = {layout:{hierarchical:{enabled:false}}, physics:{enabled:false}};

function setMode(m) {
  network.setOptions(m === 'layer' ? layered : free);
  if (m === 'layer') visNodes.update(D.nodes.map(n => ({id:n.id, x:n.col*330, y:pos[n.id]})));
  else visNodes.update(D.nodes.map(n => ({id:n.id, x:undefined, y:undefined})));

  document.getElementById('b-force').classList.toggle('on', m === 'free');

document.getElementById('b-layer').onclick = () => setMode('layer');

document.getElementById('b-theme').onclick = () => {

  r.dataset.theme = light ? 'light' : '';

  visNodes.update(D.nodes.map(n => ({id:n.id, font:{color:c, size:11}})));
};

function resetStyle() {
  visNodes.update(D.nodes.map(n => ({id:n.id, hidden:hidden.has(n.col), opacity:1})));
  visEdges.update(D.edges.map((e,i) => ({id:i, color:{color:'#5a5a7a', opacity:.5}, width:1, hidden:hidden.has(byId[e[0]].col)||hidden.has(byId[e[1]].col)})));
}
function walk(id, dir, seen) {
  D.edges.forEach(([s,t]) => { const a = dir>0 ? s : t, b = dir>0 ? t : s; if (a===id && !seen.has(b)) { seen.add(b); walk(b, dir, seen); } });

let outIdx = null;
function focusNode(id) {
  const up = new Set([id]), down = new Set([id]);

  (function w(x, m, set) { (m[x]||[]).forEach(y => { if (!set.has(y)) { set.add(y); w(y, m, set); } }); })(id, inn, up);

function renderExplain(n, up) {

// legend
const lg = document.getElementById('legend');
LAYERS.forEach((l,i) => {
  const cnt = D.nodes.filter(n => n.col===i).length, d = document.createElement('div');

const sb = document.getElementById('search'), sr = document.getElementById('search-results');
sb.oninput = () => {

const as = document.getElementById('api-search'), ar = document.getElementById('api-results');
